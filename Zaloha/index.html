<!DOCTYPE html>
<html lang="cs" data-page="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetCare - Rezervace termínu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="themes.css">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Horní navigace -->
    <nav class="bg-slate-800/90 backdrop-blur border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-paw text-emerald-400 text-3xl"></i>
            <div>
                <span class="text-2xl font-bold tracking-tight text-white block">VET-CARE</span>
                <span id="nav-company-name" class="text-xs text-emerald-400 font-medium">Veterinární rezervační systém</span>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <a id="tv-link" href="tv.html" target="_blank" class="px-4 py-2 text-sm font-semibold text-slate-300 hover:text-white transition hidden md:inline-flex items-center">
                <i class="fa-solid fa-tv mr-2"></i>Čekárna TV
            </a>
            <button onclick="openAuthModal()" class="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl shadow-lg transition flex items-center">
                <i class="fa-solid fa-right-to-bracket mr-2"></i>Přihlásit
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8 w-full">
        
        <!-- Banner vybrané firmy / kliniky podle IČO -->
        <div id="company-info-card" class="bg-slate-800 border border-slate-700 rounded-2xl p-6 mb-8 shadow-xl hidden">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="bg-emerald-500/10 text-emerald-400 text-xs font-bold px-2.5 py-1 rounded-md border border-emerald-500/20">IČO: <span id="info-ico">-</span></span>
                        <h2 id="info-nazev" class="text-2xl font-bold text-white">Načítání firmy...</h2>
                    </div>
                    <p id="info-adresa" class="text-slate-400 text-sm mt-1"><i class="fa-solid fa-location-dot mr-1 text-emerald-400"></i> -</p>
                </div>
                <div class="flex flex-wrap gap-4 text-xs text-slate-300">
                    <span id="info-telefon"><i class="fa-solid fa-phone text-emerald-400 mr-1"></i> -</span>
                    <span id="info-email"><i class="fa-solid fa-envelope text-emerald-400 mr-1"></i> -</span>
                </div>
            </div>
        </div>

        <!-- Hlavní Rezervační Karta -->
        <div class="bg-slate-800/60 border border-slate-700 backdrop-blur rounded-3xl p-6 md:p-8 shadow-2xl">
            <div class="border-b border-slate-700 pb-4 mb-6">
                <h1 class="text-2xl font-extrabold text-white flex items-center gap-2">
                    <i class="fa-solid fa-calendar-plus text-emerald-400"></i>
                    Online rezervace termínu
                </h1>
                <p class="text-slate-400 text-sm mt-1">Vyberte pobočku, úkon a preferovaný čas návštěvy.</p>
            </div>

            <form id="public-booking-form" onsubmit="handlePublicBooking(event)" class="space-y-6">
                
                <!-- 1. Výběr Ordinace a Úkonu -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">1. Vyberte pobočku / ordinaci *</label>
                        <select id="book-ordinace" onchange="onOrdinaceSelect()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none" required>
                            <option value="">-- Vyberte ordinaci --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">2. Typ požadovaného úkonu *</label>
                        <select id="book-ukon" onchange="loadAvailableSlots()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none" required>
                            <option value="">-- Vyberte úkon --</option>
                        </select>
                    </div>
                </div>

                <!-- 2. Výběr Lékaře a Datumu -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">3. Preferovaný lékař *</label>
                        <select id="book-lekar" onchange="loadAvailableSlots()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none" required>
                            <option value="">-- Vyberte lékaře --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">4. Datum návštěvy *</label>
                        <input type="date" id="book-datum" onchange="loadAvailableSlots()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none" required>
                    </div>
                </div>

                <!-- 3. Výběr Časového Slotu -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">5. Volné časové termíny *</label>
                    <div id="slots-container" class="grid grid-cols-3 sm:grid-cols-6 gap-2 bg-slate-900/50 p-4 rounded-xl border border-slate-700/80 min-h-[60px] items-center">
                        <span class="text-xs text-slate-500 col-span-full text-center">Nejprve zvolte pobočku, úkon, lékaře a datum...</span>
                    </div>
                    <input type="hidden" id="selected-slot" required>
                </div>

                <hr class="border-slate-700/60 my-6">

                <!-- 4. Kontaktní údaje zákazníka a zvířete -->
                <h3 class="text-sm font-bold text-emerald-400 uppercase tracking-wider mb-3">Údaje o majiteli a pacientovi</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Jméno a Příjmení majitele *</label>
                        <input type="text" id="cust-jmeno" placeholder="Jan Novák" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Telefon *</label>
                        <input type="tel" id="cust-telefon" placeholder="+420 777 123 456" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="md:col-span-1">
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">E-mail (pro potvrzení) *</label>
                        <input type="email" id="cust-email" placeholder="jan@seznam.cz" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Jméno zvířete *</label>
                        <input type="text" id="pet-jmeno" placeholder="Rex" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Druh zvířete *</label>
                        <select id="pet-druh" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500">
                            <option value="">-- Vyberte --</option>
                            <option value="Pes">Pes</option>
                            <option value="Kočka">Kočka</option>
                            <option value="Hlodavec">Hlodavec</option>
                            <option value="Pták">Pták</option>
                            <option value="Jiné">Jiné</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Poznámka / Důvod návštěvy</label>
                    <textarea id="book-poznamka" rows="2" placeholder="Popište zdravotní potíže zvířete..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500"></textarea>
                </div>

                <button type="submit" class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold text-lg rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check-circle"></i>
                    Potvrdit a odeslat rezervaci
                </button>
            </form>

            <div id="booking-status" class="mt-4 p-4 rounded-xl text-center hidden font-bold"></div>
        </div>
    </main>

    <!-- Modal Okno: Přihlášení / Registrace -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="flex border-b border-slate-700 mb-6">
                <button id="tab-login-btn" onclick="switchAuthTab('login')" class="w-1/2 py-2 font-bold text-emerald-400 border-b-2 border-emerald-400">Přihlášení</button>
                <button id="tab-reg-btn" onclick="switchAuthTab('register')" class="w-1/2 py-2 font-bold text-slate-400 hover:text-slate-200">Registrace</button>
            </div>

            <!-- Formulář Přihlášení -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-1">E-mail</label>
                    <input type="email" id="login-email" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Heslo</label>
                    <input type="password" id="login-password" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <button type="submit" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl transition">Vstoupit do systému</button>
            </form>

            <!-- Formulář Registrace -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Jméno</label>
                        <input type="text" id="reg-jmeno" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Příjmení</label>
                        <input type="text" id="reg-prijmeni" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-1">E-mail</label>
                    <input type="email" id="reg-email" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Telefon</label>
                    <input type="tel" id="reg-telefon" required class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Heslo</label>
                    <input type="password" id="reg-password" required minlength="6" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <button type="submit" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl transition">Vytvořit účet</button>
            </form>
        </div>
    </div>

    <footer class="text-center text-slate-500 text-sm py-6 border-t border-slate-800 mt-8">
        &copy; 2026 VET-CARE Rezervační Systém
    </footer>

    <!-- Vložení JavaScript souboru -->
    <script src="index.js"></script>
</body>
</html>
