<!DOCTYPE html>
<html lang="cs" data-page="dark">
<head>
    <meta charset="UTF-8">
    <title>VetCare - Čekárna TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="themes.css">
    <script src="theme.js"></script>
    <script src="i18n.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .live-pulse { animation: pulse-slow 2s infinite; }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen p-8 flex flex-col justify-between">
    <header class="flex justify-between items-center border-b border-slate-800 pb-6">
        <div class="flex items-center space-x-4">
            <i class="fa-solid fa-hospital text-emerald-400 text-4xl"></i>
            <div>
                <h1 class="text-3xl font-black tracking-wider">VET-CARE CLINIC</h1>
                <p class="text-slate-400 text-sm">Centrální Ordinace</p>
            </div>
        </div>
        <div id="tv-clock" class="text-5xl font-mono font-bold text-emerald-400">00:00:00</div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-2 gap-8 my-auto py-6">
        <!-- Právě v ordinaci -->
        <div class="bg-emerald-950/60 border-2 border-emerald-500 rounded-3xl p-8 shadow-2xl">
            <div class="flex items-center space-x-3 mb-6">
                <span class="w-4 h-4 bg-emerald-400 rounded-full live-pulse"></span>
                <span class="text-sm font-black uppercase tracking-widest text-emerald-400">Právě v ordinaci</span>
            </div>
            <div id="tv-current-patient" class="space-y-2">
                <div class="text-5xl font-black text-white">Rex (Pes)</div>
                <div class="text-xl text-emerald-200">Majitel: Dvořák</div>
            </div>
        </div>

        <!-- Čekající pacienti -->
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8">
            <h2 class="text-xl font-bold text-yellow-400 mb-6 flex items-center">
                <i class="fa-solid fa-clock mr-3"></i>ČEKAJÍCÍ PACIENTI
            </h2>
            <div id="tv-queue-list" class="space-y-4">
                <!-- Dynamicky naplňováno -->
            </div>
        </div>
    </main>

    <script>
        // Načtení přihlášeného uživatele a zjištění jeho ordinace
        const user = JSON.parse(localStorage.getItem('vetcare_user') || '{}');
        const urlParams = new URLSearchParams(window.location.search);

        // ID ordinace se vezme z URL parametru ORBI z profilu přihlášené TV ORBI výchozí 1
        const ORDINACE_ID = urlParams.get('ordinaceId') || user.preferovanaOrdinaceId || 1;

        async function fetchTvData() {
            try {
                // Volání API pro konkrétní ordinaci
                const res = await fetch(`/api/cekarna/${ORDINACE_ID}`);
                const data = await res.json();
                
                // Vykreslení dat na TV...
            } catch (err) {
                console.error('Chyba při načítání dat čekárny:', err);
            }
        }

        // Obnovování každých 5 sekund
        setInterval(fetchTvData, 5000);
        fetchTvData();
    </script>
</body>
</html>
